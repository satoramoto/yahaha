[package]
name = "yahaha-app"
version = "0.1.0"
description = "yahaha: the app shell (Tauri) around the arranger engine"
license = "MIT"
repository = "https://github.com/satoramoto/yahaha"
edition = "2024"
rust-version = "1.85"

# A member of the root workspace (../../Cargo.toml): it shares the engine's Cargo.lock and
# target directory, so its builds reuse the engine's. `cargo build` at the repo root doesn't
# build it (default-members); run cargo here, or `cargo tauri build` from app/.

[lib]
name = "yahaha_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9.5", features = [] }
# The system file picker (app/src/lib/files.ts): Load… for a file outside the library. The
# webview may only open the picker (capabilities/default.json). On the 2.7 line, the one that
# matches tauri 2.11 and @tauri-apps/plugin-dialog ~2.7.3.
tauri-plugin-dialog = "2.7"
# The engine library alone (no terminal UI): Session, AppCmd, AppState.
yahaha = { path = "../..", default-features = false }

# On macOS, with the plugin host (Audio Unit instruments on the keyboard parts,
# docs/plugin-hosting.md). Plugin hosting is macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
yahaha = { path = "../..", default-features = false, features = ["plugins"] }
